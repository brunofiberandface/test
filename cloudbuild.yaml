# Cloud Build config for deploying to Cloud Run
steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/gstar-studio', '.']

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gstar-studio']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gstar-studio'
      - '--image=gcr.io/$PROJECT_ID/gstar-studio'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,NEXTAUTH_URL=https://gstar-studio-${_HASH}-uc.a.run.app,NEXTAUTH_SECRET=${_NEXTAUTH_SECRET}'

images:
  - 'gcr.io/$PROJECT_ID/gstar-studio'
